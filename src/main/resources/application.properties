server.port=28090
spring.thymeleaf.cache=false
spring.datasource.name=flower-mall-datasource
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# 数据库与账号说明：连 flower_mall_db，账号为最小权限角色 flower_app
# （只有 SELECT/INSERT/UPDATE/EXECUTE，没有 DELETE、没有结构变更权限，见 06_security.sql）
# allowPublicKeyRetrieval：caching_sha2_password 在非SSL通道需要取服务器RSA公钥；
# 本地演示可开，生产应改走TLS连接（安全设计章的口述点）
spring.datasource.url=jdbc:mysql://localhost:3306/flower_mall_db?useUnicode=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&autoReconnect=true&useSSL=false&allowMultiQueries=true&allowPublicKeyRetrieval=true
spring.datasource.username=flower_app
spring.datasource.password=F1ower#App2026
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.pool-name=hikariCP
spring.datasource.hikari.max-lifetime=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1
# mybatis config
mybatis.mapper-locations=classpath:mapper/*Mapper.xml